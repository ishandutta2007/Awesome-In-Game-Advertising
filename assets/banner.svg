<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8A2387;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E94057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27121;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; }
      .subtitle { font: 20px sans-serif; fill: white; }
      .anim { animation: pulse 3s infinite alternate; }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15"/>
  <g class="anim" transform-origin="center">
    <text x="50%" y="45%" text-anchor="middle" class="title">Awesome In-Game Advertising</text>
    <text x="50%" y="65%" text-anchor="middle" class="subtitle">Platforms, Tools &amp; Open Source SDKs</text>
  </g>
</svg>
